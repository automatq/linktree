<svg width="120" height="140" viewBox="0 0 120 140" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="120" height="140" fill="black"/>

  <!-- Trunk -->
  <line x1="60" y1="130" x2="60" y2="75" stroke="white" stroke-width="4" stroke-linecap="round"/>

  <!-- Branch left -->
  <line x1="60" y1="95" x2="25" y2="65" stroke="white" stroke-width="3" stroke-linecap="round"/>

  <!-- Branch right -->
  <line x1="60" y1="95" x2="95" y2="65" stroke="white" stroke-width="3" stroke-linecap="round"/>

  <!-- Branch center -->
  <line x1="60" y1="75" x2="60" y2="45" stroke="white" stroke-width="3" stroke-linecap="round"/>

  <!-- Leaf left -->
  <ellipse cx="25" cy="50" rx="14" ry="18" fill="white" fill-opacity="0.18" stroke="white" stroke-width="2" transform="rotate(-20 25 50)"/>
  <line x1="25" y1="65" x2="25" y2="37" stroke="white" stroke-width="1.5" opacity="0.35" transform="rotate(-20 25 50)"/>

  <!-- Leaf right -->
  <ellipse cx="95" cy="50" rx="14" ry="18" fill="white" fill-opacity="0.18" stroke="white" stroke-width="2" transform="rotate(20 95 50)"/>
  <line x1="95" y1="65" x2="95" y2="37" stroke="white" stroke-width="1.5" opacity="0.35" transform="rotate(20 95 50)"/>

  <!-- Leaf center (top) -->
  <ellipse cx="60" cy="28" rx="14" ry="18" fill="white" fill-opacity="0.18" stroke="white" stroke-width="2"/>
  <line x1="60" y1="45" x2="60" y2="12" stroke="white" stroke-width="1.5" opacity="0.35"/>

  <!-- Root lines -->
  <line x1="60" y1="130" x2="40" y2="138" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
  <line x1="60" y1="130" x2="80" y2="138" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
</svg>
